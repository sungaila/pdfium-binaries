name: Weekly schedule

on:
  schedule:
    - cron:  '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  trigger:
    name: Trigger build
    runs-on: ubuntu-latest
    permissions:
      actions: write # Trigger downstream workflow
    steps:
    - name: Trigger build
      uses: benc-uk/workflow-dispatch@master
      with:
        workflow: Build Wasm
        token: "${{ secrets.PERSONAL_ACCESS_TOKEN }}"